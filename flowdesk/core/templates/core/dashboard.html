<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>FlowDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">FlowDesk Dashboard</h1>

      <div class="row">
        <div class="col-md-3">
          <div class="card text-bg-primary mb-3">
            <div class="card-body">
              <h5>Produtos</h5>
              <h2>{{ total_products }}</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-success mb-3">
            <div class="card-body">
              <h5>Categorias</h5>
              <h2>{{ total_categories }}</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-warning mb-3">
            <div class="card-body">
              <h5>Clientes</h5>
              <h2>{{ total_customers }}</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-danger mb-3">
            <div class="card-body">
              <h5>Vendas</h5>
              <h2>{{ total_sales }}</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
