{% extends 'base.html' %}

{% block content %}
  <h1 class="mb-4">Produtos</h1>

  <a href="{% url 'product_create' %}" class="btn btn-success mb-3">Novo Produto</a>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      {% for product in products %}
        <tr>
          <td>{{ product.name }}</td>
          <td>{{ product.category }}</td>
          <td>R$ {{ product.price }}</td>
          <td>{{ product.stock }}</td>

          <td>
            <a href="{% url 'product_update' product.id %}" class="btn btn-warning btn-sm">Editar</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="5">Nenhum produto cadastrado.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
