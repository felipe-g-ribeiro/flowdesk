{% extends 'base.html' %}

{% block content %}
  <h1 class="mb-4">Dashboard</h1>

  <div class="row">
    <div class="col-md-3">
      <div class="card text-bg-primary">
        <div class="card-body">
          <h5>Produtos</h5>
          <h2>{{ total_products }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-success">
        <div class="card-body">
          <h5>Categorias</h5>
          <h2>{{ total_categories }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-warning">
        <div class="card-body">
          <h5>Clientes</h5>
          <h2>{{ total_customers }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-danger">
        <div class="card-body">
          <h5>Vendas</h5>
          <h2>{{ total_sales }}</h2>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
