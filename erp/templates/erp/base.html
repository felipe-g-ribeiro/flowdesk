<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flowdesk ERP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'erp:dashboard' %}">Flowdesk ERP</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'erp:categoria_list' %}">Categorias</a>
          <a class="nav-link" href="{% url 'erp:produto_list' %}">Produtos</a>
          <a class="nav-link" href="{% url 'erp:cliente_list' %}">Clientes</a>
          <a class="nav-link" href="{% url 'erp:venda_list' %}">Vendas</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <div class="modal fade" id="erpModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modal-body"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
