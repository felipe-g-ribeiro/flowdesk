{% extends 'base.html' %}

{% block content %}
  <h1 class="mb-4">Categorias</h1>

  <a href="{% url 'category_create' %}" class="btn btn-success mb-3">Nova Categoria</a>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      {% for category in categories %}
        <tr>
          <td>{{ category.name }}</td>

          <td>
            <a href="{% url 'category_update' category.id %}" class="btn btn-warning btn-sm">Editar</a>

            <a href="{% url 'category_delete' category.id %}" class="btn btn-danger btn-sm">Excluir</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">Nenhuma categoria cadastrada.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
